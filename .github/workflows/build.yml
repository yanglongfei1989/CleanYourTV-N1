name: Build CleanYourTV-N1 APK
on:
  push:
  workflow_dispatch:

jobs:
  gen-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK17（仅用来跑老版本gradle二进制）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download standalone Gradle 6.7.1
        run: |
          wget https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip gradle-6.7.1-bin.zip
          export PATH=$PWD/gradle-6.7.1/bin:$PATH
          gradle wrapper --gradle-version 6.7.1
          chmod +x gradlew

      - name: Upload source with gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: source-with-wrapper
          path: ./

  build-apk:
    needs: gen-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Download source + wrapper
        uses: actions/download-artifact@v4
        with:
          name: source-with-wrapper
          path: ./

      - name: Setup JDK11（项目编译用）
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android SDK cmdline-tools 6.0 + SDK25
        run: |
          sudo apt update && sudo apt install -y wget unzip
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip -O cmd.zip
          unzip cmd.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/6.0
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/6.0/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/6.0/bin/sdkmanager "platforms;android-25" "build-tools;25.0.3" "platform-tools"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-N1-debug
          path: app/build/outputs/apk/debug/*.apk
