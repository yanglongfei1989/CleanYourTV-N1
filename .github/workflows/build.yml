name: Build CleanYourTV-N1 Auto
run-name: ${{ github.actor }} 自动编译
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-25 build-tools;25.0.3 platform-tools

      - name: 生成 Gradle Wrapper 6.7.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip -q gradle-6.7.1-bin.zip
          export PATH="$PWD/gradle-6.7.1/bin:$PATH"
          gradle wrapper --gradle-version 6.7.1
          chmod +x gradlew

      - name: 导出SDK路径配置
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 自动查找可打包的安卓模块
        id: find_module
        run: |
          ./gradlew projects --quiet > sub_list.txt
          MODULE=$(grep -E '^\s*\+ Project' sub_list.txt | head -n1 | sed -E 's/.*Project \'([^\']+)\'.*/\1/')
          echo "MODULE=$MODULE" >> $GITHUB_ENV
          echo "找到模块名称: $MODULE"

      - name: 执行编译 :${{ env.MODULE }}:assembleDebug
        run: ./gradlew :${{ env.MODULE }}:assembleDebug

      - name: 上传编译产物APK
        uses: actions/upload-artifact@v4
        with:
          name: 编译好的APK
          path: |
            */build/outputs/apk/debug/*.apk
