name: Build CleanYourTV-N1
run-name: ${{ github.actor }} 编译CleanYourTV-N1
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 8 【重点！老项目必须JDK8】
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-25 build-tools;25.0.3 platform-tools

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 配置全局阿里云Maven镜像（不修改源码文件）
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/jcenter' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 执行编译 assembleDebug
        run: ./gradlew assembleDebug

      - name: 上传编译产物APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-N1-APK
          path: build/outputs/apk/debug/*.apk
