name: Build CleanYourTV-N1
run-name: ${{ github.actor }} 编译CleanYourTV-N1
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-25 build-tools;25.0.3 platform-tools

      - name: 生成 Gradle Wrapper 6.7.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip
          unzip -q gradle-6.7.1-bin.zip
          export PATH="$PWD/gradle-6.7.1/bin:$PATH"
          gradle wrapper --gradle-version 6.7.1
          chmod +x gradlew

      - name: 写入SDK配置
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 查看可用任务（调试用）
        run: ./gradlew tasks

      - name: 编译Debug APK（根项目直接打包，不带模块前缀！）
        run: ./gradlew assembleDebug

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-N1-APK
          path: build/outputs/apk/debug/*.apk
