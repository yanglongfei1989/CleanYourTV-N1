name: Build CleanYourTV-N1
run-name: ${{ github.actor }} 编译CleanYourTV-N1
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-25 build-tools;25.0.3 platform-tools

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 替换maven源为阿里云（关键修复，解决jcenter超时）
        run: |
          sed -i 's|https://maven.google.com|https://maven.aliyun.com/repository/google|g' build.gradle
          sed -i 's|https://jcenter.bintray.com|https://maven.aliyun.com/repository/jcenter|g' build.gradle
          sed -i 's|https://repo1.maven.org/maven2|https://maven.aliyun.com/repository/public|g' build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run assembleDebug
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-N1-APK
          path: build/outputs/apk/debug/*.apk
